[project]
name = "perforata"
version = "0.2.0"
description = "Parametric perforation pattern generator — node-graph engine with Streamlit UI"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "ezdxf",
    "shapely",
    "matplotlib",
    "pillow",
    "streamlit",
    "cloudpickle",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perforata"]
