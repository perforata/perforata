[project]
name = "perforata"
version = "0.4.1"
description = "Parametric perforation pattern generator — node-graph engine with unified CLI and optional Streamlit UI"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pydantic>=2.7",
]

[project.optional-dependencies]
geo = ["shapely"]
dxf = ["ezdxf"]
raster = ["pillow"]
render = ["matplotlib"]
app = ["streamlit", "cloudpickle", "perforata[geo,dxf,raster,render]"]
all = ["perforata[app]"]

[project.scripts]
perforata = "perforata.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perforata"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Default (E4/E7/E9/F) is enough to catch real breakage without
# imposing a style migration on the existing codebase.
select = ["E4", "E7", "E9", "F"]
