name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Gate: refuse to release when the tag, pyproject.toml, and CHANGELOG
  # disagree — protects against tagging without bumping the version.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches pyproject.toml version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "tag: $TAG_VERSION / pyproject.toml: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match" \
                 "pyproject.toml version $PROJECT_VERSION." \
                 "Bump [project].version and re-tag."
            exit 1
          fi
      - name: CHANGELOG has an entry for this version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry." \
                 "Add one before releasing."
            exit 1
          fi
      - name: Version not already on PyPI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(python3 -c "
          import urllib.request
          try:
              urllib.request.urlopen('https://pypi.org/pypi/perforata/${VERSION}/json')
              print('200')
          except Exception as e:
              if hasattr(e, 'code'):
                  print(e.code)
              else:
                  print('000')
          ")
          if [ "$STATUS" = "200" ]; then
            echo "::error::perforata $VERSION already exists on PyPI." \
                 "Bump the version — releases are immutable."
            exit 1
          fi
          echo "PyPI check for $VERSION: HTTP $STATUS (not published — OK)"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # uv.lock is gitignored; key the cache on the project manifest
          cache-dependency-glob: "pyproject.toml"
      - name: Build sdist + wheel
        run: uv build
      - name: Export pipeline JSON Schema
        run: |
          uv run --with dist/perforata-*.whl --no-project -- \
            perforata schema -o pipeline.schema.json
      - name: Built artifacts match the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/perforata-$VERSION.tar.gz"
          test -f "dist/perforata-$VERSION-py3-none-any.whl"
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $VERSION" > release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*
            pipeline.schema.json
