# Code scanning: required by the "protect master" ruleset (CodeQL
# results must be present on both the PR and the target branch).
name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
